<div class="arcade-overlay">
    <div class="arcade-cabinet">
        <div class="arcade-header">
            <span class="score">1UP: {{ score | number:'2.0-0' }}</span>
            <span class="title">PAC-MAN</span>
            <span class="high-score">HIGH: {{ highScore }}</span>
        </div>

        <div class="game-screen">
            <canvas #gameCanvas width="400" height="400"></canvas>

            <div class="game-overlay" *ngIf="!isPlaying && !isMobile">
                <h1 *ngIf="gameOver">{{ 'pacman.gameOver' | translate }}</h1>
                <h1 *ngIf="gameWon" class="win">{{ 'pacman.youWin' | translate }}</h1>
                <p class="blink">{{ gameOver || gameWon ? ('pacman.pressStartRestart' | translate) :
                    ('pacman.pressStartPlay' | translate) }}</p>
            </div>

            <!-- Mobile/Tablet Warning -->
            <div class="mobile-warning" *ngIf="isMobile">
                <div class="warning-content">
                    <span class="warning-icon">👻</span>
                    <h2>{{ 'pacman.mobileWarning' | translate }}</h2>
                </div>
            </div>
        </div>

        <div class="arcade-controls">
            <div class="joystick">
                <div class="stick"></div>
            </div>
            <div class="buttons">
                <button class="action-btn red" (click)="onClose()">{{ 'pacman.exit' | translate }}</button>
                <button class="action-btn blue" (click)="startGame()" *ngIf="!isMobile">{{ 'pacman.start' | translate
                    }}</button>
            </div>
        </div>
    </div>
</div>
