<div #rendererContainer class="renderer-container" [class.loaded]="!isLoading"
     role="main" aria-label="Portfolio 3D interattivo"></div>

<!-- Controls (language + dark mode) — shown after boot screen fades out -->
<div class="controls-container" *ngIf="!isLoading">
    <!-- Language Toggle -->
    <button class="control-toggle language-toggle" (click)="toggleLanguage()"
        [attr.aria-label]="currentLanguage === 'it' ? 'Switch to English' : 'Passa all\'Italiano'">
        <svg *ngIf="currentLanguage === 'it'" class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
            <rect width="20" height="40" x="0" y="0" fill="#009246" />
            <rect width="20" height="40" x="20" y="0" fill="#FFFFFF" />
            <rect width="20" height="40" x="40" y="0" fill="#CE2B37" />
        </svg>
        <svg *ngIf="currentLanguage === 'en'" class="flag-svg" viewBox="0 0 60 40" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="stars" x="0" y="0" width="8" height="7" patternUnits="userSpaceOnUse">
                    <polygon points="4,0.5 4.8,3.2 7.5,3.2 5.4,4.8 6.1,7.5 4,5.8 1.9,7.5 2.6,4.8 0.5,3.2 3.2,3.2"
                        fill="white" />
                </pattern>
            </defs>
            <rect width="60" height="40" fill="#B22234" />
            <rect width="60" height="3.08" y="0" fill="white" />
            <rect width="60" height="3.08" y="6.15" fill="white" />
            <rect width="60" height="3.08" y="12.31" fill="white" />
            <rect width="60" height="3.08" y="18.46" fill="white" />
            <rect width="60" height="3.08" y="24.62" fill="white" />
            <rect width="60" height="3.08" y="30.77" fill="white" />
            <rect width="60" height="3.08" y="36.92" fill="white" />
            <rect width="24" height="17.23" fill="#3C3B6E" />
            <rect width="24" height="17.23" fill="url(#stars)" />
        </svg>
        <span class="language-text">{{ currentLanguage | uppercase }}</span>
    </button>

    <!-- Dark Mode Toggle -->
    <button class="control-toggle dark-mode-toggle" (click)="toggleDarkMode()"
        [attr.aria-label]="isDarkMode ? ('darkMode.disable' | translate) : ('darkMode.enable' | translate)">
        <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
        <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>
</div>

<!-- PDF Modal -->
<div class="pdf-modal-overlay" *ngIf="showPdfModal" (click)="closePdfModal()"
     role="dialog" aria-modal="true" aria-labelledby="pdf-modal-title">
    <div class="pdf-modal-container" (click)="$event.stopPropagation()">
        <div class="pdf-modal-header">
            <h2 class="pdf-modal-title" id="pdf-modal-title">{{ 'pdfModal.title' | translate }}</h2>
            <button class="pdf-modal-close" (click)="closePdfModal()" [attr.aria-label]="'pdfModal.close' | translate">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="pdf-modal-body">
            <iframe src="assets/cv.pdf" class="pdf-viewer" frameborder="0"
                title="Curriculum Vitae — Gianluca D'Arcangelo" loading="lazy">
            </iframe>
        </div>
    </div>
</div>

<!-- Cat Modal -->
<div class="cat-modal-overlay" *ngIf="showCatModal" (click)="closeCatModal()"
     role="dialog" aria-modal="true" aria-labelledby="cat-modal-title">
    <div class="cat-modal-container" (click)="$event.stopPropagation()">
        <div class="cat-modal-header">
            <div class="cat-title-group">
                <span class="cat-emoji" aria-hidden="true">🐾</span>
                <h2 class="cat-modal-title" id="cat-modal-title">{{ 'catModal.title' | translate }}</h2>
            </div>
            <button class="pdf-modal-close" (click)="closeCatModal()" [attr.aria-label]="'catModal.close' | translate">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="cat-modal-body">
            <div class="cat-image-container">
                <div class="cat-image-wrapper">
                    <picture>
                        <source srcset="assets/dolly.webp" type="image/webp">
                        <img src="assets/dolly.webp" alt="Dolly, la gatta Siberiana di Gianluca"
                             class="cat-photo" loading="lazy" width="400" height="600">
                    </picture>
                </div>
                <div class="cat-badge" aria-hidden="true">Dolly</div>
            </div>
            <div class="cat-content">
                <p class="cat-intro">{{ 'catModal.intro' | translate }}</p>
                <div class="cat-description-box">
                    <p>{{ 'catModal.description' | translate }}</p>
                    <p class="cat-personality">{{ 'catModal.personality' | translate }}</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Desktop overlay — loaded lazily after "Enter Portfolio" click -->
<ng-container #desktopContainer></ng-container>

<!-- Game Component Overlay — loaded lazily on first open -->
<ng-container #gameContainer></ng-container>
