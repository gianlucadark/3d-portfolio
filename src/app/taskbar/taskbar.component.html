<div class="taskbar">
  <button class="start-button" (click)="onStartClick()">
    <img src="assets/icons/start.webp" alt="" class="start-flag" width="24" height="24" decoding="async">
    <span class="start-text">{{ 'desktop.startText' | translate }}</span>
  </button>

  <!-- Quick Launch -->
  <div class="quick-launch">
    <div class="taskbar-separator"></div>
    <button class="quick-launch-item" (click)="onWindowClick(1)" [attr.title]="'icons.computer' | translate">
      <img src="assets/icons/computer.webp" [alt]="'icons.computer' | translate" width="24" height="24" loading="lazy" decoding="async">
    </button>
    <button class="quick-launch-item" [attr.title]="'common.desktop' | translate" (click)="onStartClick()">
      <img src="assets/icons/computer.webp" [alt]="'common.desktop' | translate" style="filter: hue-rotate(90deg);" width="24" height="24" loading="lazy" decoding="async">
    </button>
    <button class="quick-launch-item" (click)="onWindowClick(6)" [attr.title]="'icons.paint' | translate">
      <img src="assets/icons/paint.webp" [alt]="'icons.paint' | translate" width="24" height="24" loading="lazy" decoding="async">
    </button>
    <div class="taskbar-separator"></div>
  </div>

  <div class="taskbar-icons">
    <button *ngFor="let window of openWindows" class="taskbar-item" [class.active]="!window.isMinimized"
      (click)="onWindowClick(window.id)" [title]="window.title">
      <img [src]="window.icon" [alt]="window.title">
      <span class="window-title">{{ window.title }}</span>
    </button>
  </div>

  <div class="taskbar-spacer"></div>

  <div class="system-tray">
    <div class="tray-icons">
      <button class="tray-lang-toggle" (click)="onLanguageToggle()">
        {{ currentLanguage | uppercase }}
      </button>
      <img src="assets/icons/volume.webp" alt="Volume" class="tray-icon" width="20" height="20" loading="lazy" decoding="async">
    </div>
    <div class="clock">{{ currentTime }}</div>
  </div>
</div>
